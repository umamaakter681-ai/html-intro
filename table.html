<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table</title>
  <style>
    table{
      border-collapse: collapse;
    }
    td,th{
      border: 1px solid black;
      padding: 10px 20px;
    }

</head>
<body>

    </table>
    </main>
  </body>
  <section>
    <h3> Table info</h3>
      <ul>

</html>
